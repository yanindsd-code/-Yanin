<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>กระดานคิว</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
    .live-dot { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .flash { animation: flash 3s ease-out; }
    @keyframes flash { 0% { background: rgba(16,185,129,.45); } 100% { background: transparent; } }
    .chip-on { background:#f1f5f9; color:#0f172a; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-20 bg-slate-900/95 backdrop-blur border-b border-slate-800">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <h1 class="text-lg sm:text-xl font-extrabold leading-tight">📋 กระดานคิว</h1>
        <p class="text-xs text-slate-400 flex items-center gap-1.5">
          <span id="liveDot" class="live-dot inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
          <span id="updatedAt">กำลังโหลด…</span>
        </p>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button id="refreshBtn" class="px-3 py-2 rounded-xl bg-slate-800 text-sm font-bold active:bg-slate-700">↻</button>
        <button onclick="showSetup()" class="px-3 py-2 rounded-xl bg-slate-800 text-sm font-bold active:bg-slate-700" title="ตั้งค่า">⚙️</button>
        <a href="index.html" class="px-3 py-2 rounded-xl bg-cyan-500 text-slate-950 text-sm font-extrabold active:bg-cyan-600">📷 สแกน</a>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 pb-12">

    <!-- Summary -->
    <section class="mt-4">
      <div class="flex items-end justify-between mb-2">
        <div>
          <div class="text-xs text-slate-400">มาแล้วทั้งหมด</div>
          <div class="text-3xl font-extrabold"><span id="sumIn" class="text-emerald-400">–</span><span class="text-slate-500 text-xl"> / <span id="sumAll">–</span></span></div>
        </div>
        <div class="text-right text-xs text-slate-400">ยังไม่มา <span id="sumOut" class="text-lg font-extrabold text-amber-400">–</span> คน</div>
      </div>
      <div id="roleCards" class="grid grid-cols-2 lg:grid-cols-4 gap-2"></div>
    </section>

    <!-- Controls -->
    <section class="mt-5 space-y-3">
      <input id="search" type="search" placeholder="🔍 ค้นหาชื่อ / รหัส / สาขา"
        class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-base focus:outline-none focus:ring-2 focus:ring-cyan-500">
      <div class="grid grid-cols-3 gap-1 p-1 rounded-2xl bg-slate-900 border border-slate-800" id="statusTabs">
        <button data-status="all" class="st py-2.5 rounded-xl font-bold text-sm">ทั้งหมด</button>
        <button data-status="in" class="st py-2.5 rounded-xl font-bold text-sm">✅ มาแล้ว</button>
        <button data-status="out" class="st py-2.5 rounded-xl font-bold text-sm">⏳ ยังไม่มา</button>
      </div>
      <div id="roleChips" class="flex gap-2 overflow-x-auto pb-1"></div>
    </section>

    <!-- List -->
    <section class="mt-4">
      <div class="hidden sm:grid grid-cols-[4.5rem_1fr_9rem_6rem_9rem] gap-3 px-3 pb-2 text-xs text-slate-500 font-semibold">
        <div>ลำดับ</div><div>ชื่อ / สาขา</div><div>กลุ่ม</div><div>ที่นั่ง</div><div>สถานะ</div>
      </div>
      <ul id="list" class="space-y-2"></ul>
      <p id="empty" class="hidden text-center text-slate-500 py-10">ไม่มีรายการตามเงื่อนไข</p>
      <p id="error" class="hidden mt-3 p-3 rounded-xl bg-red-950 border border-red-800 text-red-200 text-sm"></p>
    </section>
  </main>

<script>

/* ===== ตั้งค่า API สำหรับเวอร์ชันโฮสต์ภายนอก =====
   URL /exec ถูกเก็บในเครื่อง (localStorage) หลังกรอกครั้งแรก
   หรือส่งลิงก์แบบ ?api=<URL /exec> ให้สตาฟฟ์ เพื่อตั้งค่าอัตโนมัติ */
const API_KEY = 'checkin_api_url';
function getApiUrl() {
  const fromParam = new URLSearchParams(location.search).get('api');
  if (fromParam) { try { localStorage.setItem(API_KEY, fromParam); } catch (e) {} return fromParam; }
  try { return localStorage.getItem(API_KEY) || ''; } catch (e) { return ''; }
}
let API_URL = getApiUrl();

function apiFetch(action, payload = {}) {
  if (!API_URL) return Promise.reject(new Error('ยังไม่ได้ตั้งค่า URL ของระบบ'));
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload }),
  }).then(r => r.json());
}

function showSetup(message) {
  let box = document.getElementById('setupBox');
  if (!box) {
    box = document.createElement('div');
    box.id = 'setupBox';
    box.className = 'fixed inset-0 z-[60] bg-slate-950/95 flex items-center justify-center p-4';
    box.innerHTML = `
      <div class="w-full max-w-md rounded-3xl bg-white text-slate-900 p-5">
        <h2 class="text-xl font-extrabold">⚙️ ตั้งค่าระบบ</h2>
        <p class="text-sm text-slate-600 mt-1">วาง Web app URL (ลงท้ายด้วย <b>/exec</b>) จาก Apps Script</p>
        <textarea id="setupUrl" rows="3" class="mt-3 w-full p-3 rounded-xl border border-slate-300 text-sm break-all" placeholder="https://script.google.com/macros/s/.../exec"></textarea>
        <p id="setupMsg" class="text-sm mt-2 text-red-600"></p>
        <button id="setupSave" class="mt-3 w-full py-3 rounded-2xl bg-slate-900 text-white font-extrabold">บันทึกและทดสอบ</button>
      </div>`;
    document.body.appendChild(box);
    document.getElementById('setupUrl').value = API_URL;
    document.getElementById('setupSave').onclick = async () => {
      const url = document.getElementById('setupUrl').value.trim();
      const msg = document.getElementById('setupMsg');
      if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { msg.textContent = 'URL ต้องขึ้นต้นด้วย https://script.google.com และลงท้ายด้วย /exec'; return; }
      msg.className = 'text-sm mt-2 text-slate-500'; msg.textContent = 'กำลังทดสอบการเชื่อมต่อ…';
      API_URL = url;
      try {
        const s = await apiFetch('stats');
        if (!s || !s.ok) throw new Error((s && s.message) || 'ไม่ได้รับข้อมูล');
        try { localStorage.setItem(API_KEY, url); } catch (e) {}
        location.reload();
      } catch (err) {
        msg.className = 'text-sm mt-2 text-red-600';
        msg.textContent = 'เชื่อมต่อไม่สำเร็จ: ' + (err.message || err) + ' — ตรวจว่า Deploy แบบ Who has access: Anyone';
      }
    };
  }
  if (message) document.getElementById('setupMsg').textContent = message;
}

const REFRESH_MS = 10000;
const ROLES = [
  { key: 'ผู้สนับสนุนรับโล่',         short: 'รับโล่',       badge: 'bg-rose-100 text-rose-800',     bar: 'bg-rose-500' },
  { key: 'ผู้สนับสนุนรับเกียรติบัตร',  short: 'เกียรติบัตร',  badge: 'bg-amber-100 text-amber-800',   bar: 'bg-amber-500' },
  { key: 'ผู้เชี่ยวชาญสาขา',          short: 'ผู้เชี่ยวชาญ',  badge: 'bg-purple-100 text-purple-800', bar: 'bg-purple-500' },
  { key: 'เยาวชนผู้เข้าแข่งขัน',       short: 'เยาวชน',       badge: 'bg-blue-100 text-blue-800',     bar: 'bg-blue-500' },
];
const roleInfo = r => ROLES.find(x => x.key === r) || { key: r, short: r || 'อื่นๆ', badge: 'bg-slate-200 text-slate-800', bar: 'bg-slate-400' };

const $ = id => document.getElementById(id);
let people = [];
let prevIn = null;           // Set ของ id ที่มาแล้วในรอบก่อน (ใช้ไฮไลต์คนที่เพิ่งมา)
let justArrived = new Set();
let filter = { status: 'all', role: 'all', q: '' };
let loading = false;

/* ---------------- Data ---------------- */
function load() {
  if (loading) return;
  loading = true;
  apiFetch('queue')
    .then(res => { loading = false; onData(res); })
    .catch(err => { loading = false; showError('เชื่อมต่อไม่สำเร็จ: ' + (err.message || err)); });
}

function onData(res) {
  if (!res || !res.ok) return showError((res && res.message) || 'โหลดข้อมูลไม่สำเร็จ');
  $('error').classList.add('hidden');
  $('liveDot').className = 'live-dot inline-block w-2 h-2 rounded-full bg-emerald-400';
  people = res.people;
  const nowIn = new Set(people.filter(p => p.checkedIn).map(p => p.id));
  justArrived = prevIn ? new Set([...nowIn].filter(id => !prevIn.has(id))) : new Set();
  prevIn = nowIn;
  $('updatedAt').textContent = 'อัปเดตอัตโนมัติทุก 10 วินาที · ล่าสุด ' + (res.serverTime.split(' ')[1] || res.serverTime);
  renderSummary();
  renderList();
}

function showError(msg) {
  $('error').textContent = msg;
  $('error').classList.remove('hidden');
  $('liveDot').className = 'inline-block w-2 h-2 rounded-full bg-red-500';
}

/* ---------------- Render ---------------- */
function seqNum(p) {
  const n = parseFloat(p.sequence);
  return isNaN(n) ? Infinity : n;   // ลำดับว่าง/รอประกาศ ไปอยู่ท้าย
}

function renderSummary() {
  const all = people.length, inCount = people.filter(p => p.checkedIn).length;
  $('sumAll').textContent = all; $('sumIn').textContent = inCount; $('sumOut').textContent = all - inCount;

  const wrap = $('roleCards'); wrap.innerHTML = '';
  ROLES.forEach(r => {
    const grp = people.filter(p => p.role === r.key);
    if (!grp.length) return;
    const n = grp.filter(p => p.checkedIn).length, pct = Math.round(n / grp.length * 100);
    const card = document.createElement('button');
    card.className = 'text-left p-3 rounded-2xl bg-slate-900 border ' + (filter.role === r.key ? 'border-cyan-500' : 'border-slate-800');
    card.onclick = () => setRole(filter.role === r.key ? 'all' : r.key);
    card.innerHTML = `<div class="text-xs text-slate-400 truncate"></div>
      <div class="text-xl font-extrabold mt-0.5">${n}<span class="text-slate-500 text-sm"> / ${grp.length}</span></div>
      <div class="h-1.5 rounded-full bg-slate-800 mt-2 overflow-hidden"><div class="h-full ${r.bar}" style="width:${pct}%"></div></div>`;
    card.firstElementChild.textContent = r.key;
    wrap.appendChild(card);
  });

  const chips = $('roleChips'); chips.innerHTML = '';
  [{ key: 'all', short: 'ทุกกลุ่ม' }, ...ROLES].forEach(r => {
    const b = document.createElement('button');
    b.className = 'shrink-0 px-3 py-1.5 rounded-full text-sm font-bold border border-slate-700 ' + (filter.role === r.key ? 'chip-on' : 'text-slate-300');
    b.textContent = r.short;
    b.onclick = () => setRole(r.key);
    chips.appendChild(b);
  });

  document.querySelectorAll('.st').forEach(b => {
    const on = b.dataset.status === filter.status;
    b.className = 'st py-2.5 rounded-xl font-bold text-sm ' + (on ? 'bg-slate-100 text-slate-900' : 'text-slate-400');
  });
}

function renderList() {
  const q = filter.q.trim().toLowerCase();
  const rows = people
    .filter(p => filter.status === 'all' || (filter.status === 'in' ? p.checkedIn : !p.checkedIn))
    .filter(p => filter.role === 'all' || p.role === filter.role)
    .filter(p => !q || (p.name + ' ' + p.id + ' ' + p.branch).toLowerCase().includes(q))
    .sort((a, b) => seqNum(a) - seqNum(b) || a.id.localeCompare(b.id));

  const ul = $('list'); ul.innerHTML = '';
  $('empty').classList.toggle('hidden', rows.length > 0);

  rows.forEach(p => {
    const r = roleInfo(p.role);
    const li = document.createElement('li');
    li.className = 'grid grid-cols-[3.5rem_1fr] sm:grid-cols-[4.5rem_1fr_9rem_6rem_9rem] gap-x-3 gap-y-1 items-center p-3 rounded-2xl border ' +
      (p.checkedIn ? 'bg-slate-900 border-emerald-900/60' : 'bg-slate-900/50 border-slate-800 opacity-80') +
      (justArrived.has(p.id) ? ' flash' : '');

    const seq = document.createElement('div');
    seq.className = 'row-span-2 sm:row-span-1 text-center rounded-xl py-2 ' + (p.sequence ? 'bg-slate-800' : 'bg-amber-900/40');
    seq.innerHTML = p.sequence
      ? `<div class="text-2xl font-extrabold leading-none"></div>`
      : `<div class="text-xs font-bold text-amber-300 leading-tight">รอ<br>ประกาศ</div>`;
    if (p.sequence) seq.firstElementChild.textContent = p.sequence;

    const main = document.createElement('div'); main.className = 'min-w-0';
    const nm = document.createElement('div'); nm.className = 'font-bold leading-snug'; nm.textContent = p.name;
    const sub = document.createElement('div'); sub.className = 'text-xs text-slate-400 truncate';
    sub.textContent = 'รหัส ' + p.id + (p.branch ? ' · ' + p.branch : '');
    main.append(nm, sub);

    const role = document.createElement('div');
    role.innerHTML = `<span class="inline-block px-2 py-0.5 rounded-full text-xs font-bold ${r.badge}"></span>`;
    role.firstElementChild.textContent = r.short;

    const seat = document.createElement('div'); seat.className = 'text-sm';
    seat.innerHTML = '<span class="sm:hidden text-slate-500">ที่นั่ง </span><span class="font-bold"></span>';
    seat.lastElementChild.textContent = p.seat || '-';

    const st = document.createElement('div'); st.className = 'text-sm';
    if (p.checkedIn) {
      st.innerHTML = '<span class="text-emerald-400 font-bold">✅ มาแล้ว</span> <span class="text-xs text-slate-400"></span>';
      st.lastElementChild.textContent = (p.time.split(' ')[1] || p.time).slice(0, 5);
    } else {
      st.innerHTML = '<span class="text-slate-400 font-semibold">⏳ ยังไม่มา</span>';
    }

    // มือถือ: บทบาท + ที่นั่ง + สถานะ อยู่แถวเดียวกันใต้ชื่อ
    const meta = document.createElement('div');
    meta.className = 'flex flex-wrap items-center gap-x-3 gap-y-1 sm:contents';
    meta.append(role, seat, st);

    li.append(seq, main, meta);
    ul.appendChild(li);
  });
}

/* ---------------- Events ---------------- */
function setRole(k) { filter.role = k; renderSummary(); renderList(); }
document.querySelectorAll('.st').forEach(b => b.addEventListener('click', () => { filter.status = b.dataset.status; renderSummary(); renderList(); }));
$('search').addEventListener('input', e => { filter.q = e.target.value; renderList(); });
$('refreshBtn').addEventListener('click', load);

let timer = setInterval(load, REFRESH_MS);
document.addEventListener('visibilitychange', () => {
  clearInterval(timer);
  if (!document.hidden) { load(); timer = setInterval(load, REFRESH_MS); }
});
if (!API_URL) showSetup(); else load();
</script>
</body>
</html>
