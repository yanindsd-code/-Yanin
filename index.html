<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Staff Check-in</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
    #reader { border: none !important; }
    #reader video { object-fit: cover; border-radius: 1rem; }
    #reader img[alt="Info icon"], #reader__dashboard_section_csr span { display: none !important; }
    .scan-frame::after {
      content: ''; position: absolute; left: 12%; right: 12%; height: 2px; top: 15%;
      background: linear-gradient(90deg, transparent, #22d3ee, transparent);
      animation: scanline 2s ease-in-out infinite; pointer-events: none;
    }
    .scan-frame.paused::after { display: none; }
    @keyframes scanline { 0%,100% { top: 15%; } 50% { top: 85%; } }
    .pop { animation: pop .22s ease-out; }
    @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-20 bg-slate-900/95 backdrop-blur border-b border-slate-800">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-extrabold leading-tight">Staff Check-in</h1>
        <p class="text-xs text-slate-400">สแกน QR เพื่อเช็คอินผู้เข้าร่วมงาน</p>
      </div>
      <div class="flex items-center gap-3">
      <button onclick="showSetup()" class="px-3 py-2 rounded-xl bg-slate-800 text-sm font-bold active:bg-slate-700" title="ตั้งค่า">⚙️</button>
      <a href="queue.html" class="px-3 py-2 rounded-xl bg-slate-800 text-sm font-bold active:bg-slate-700">📋 คิว</a>
      <button id="statsBtn" class="text-right active:opacity-60" title="แตะเพื่อรีเฟรช">
        <div class="text-xl font-extrabold text-emerald-400"><span id="statChecked">–</span><span class="text-slate-500 text-base"> / <span id="statTotal">–</span></span></div>
        <div class="text-[11px] text-slate-400">เช็คอินแล้ว</div>
      </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pb-10">

    <!-- Mode switch -->
    <section class="mt-4">
      <div class="grid grid-cols-2 gap-1 p-1 rounded-2xl bg-slate-900 border border-slate-800">
        <button id="modeCheckIn" data-mode="checkIn" class="mode-btn py-3 rounded-xl font-bold text-sm">✅ เช็คอิน</button>
        <button id="modeLookup" data-mode="lookup" class="mode-btn py-3 rounded-xl font-bold text-sm">🔎 ตรวจสอบลำดับ</button>
      </div>
      <p id="modeHint" class="mt-2 text-xs text-slate-400 text-center"></p>
    </section>

    <!-- Scanner -->
    <section class="mt-4">
      <div id="scanFrame" class="scan-frame paused relative bg-black rounded-2xl overflow-hidden aspect-square ring-2 ring-slate-700">
        <div id="reader" class="w-full h-full"></div>
        <div id="cameraPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6">
          <svg class="w-16 h-16 text-slate-600 mb-3" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M7 12h10"/></svg>
          <p class="text-slate-400 text-sm">กดปุ่มด้านล่างเพื่อเปิดกล้อง</p>
        </div>
      </div>

      <div id="cameraError" class="hidden mt-3 p-3 rounded-xl bg-red-950 border border-red-800 text-red-200 text-sm"></div>

      <button id="cameraBtn"
        class="mt-3 w-full py-4 rounded-2xl bg-cyan-500 active:bg-cyan-600 text-slate-950 font-extrabold text-lg shadow-lg shadow-cyan-500/20">
        📷 เปิดกล้องสแกน
      </button>
    </section>

    <!-- Manual input -->
    <section class="mt-6">
      <label for="manualId" class="block text-sm font-semibold text-slate-300 mb-2">หรือพิมพ์รหัสประจำตัว</label>
      <form id="manualForm" class="flex gap-2" autocomplete="off">
        <input id="manualId" type="text" inputmode="text" enterkeyhint="search"
          placeholder="เช่น 1001"
          class="flex-1 min-w-0 px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-lg font-semibold focus:outline-none focus:ring-2 focus:ring-cyan-500">
        <button type="submit" class="px-5 rounded-xl bg-slate-100 text-slate-900 font-bold active:bg-slate-300">ค้นหา</button>
      </form>
    </section>

    <!-- History -->
    <section class="mt-8">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-sm font-semibold text-slate-300">ประวัติล่าสุด (เครื่องนี้)</h2>
        <button id="clearHistory" class="text-xs text-slate-500 active:text-slate-300">ล้าง</button>
      </div>
      <ul id="historyList" class="space-y-2">
        <li class="text-sm text-slate-500">ยังไม่มีรายการ</li>
      </ul>
    </section>
  </main>

  <!-- Loading overlay -->
  <div id="loading" class="hidden fixed inset-0 z-40 bg-slate-950/80 flex flex-col items-center justify-center">
    <div class="w-14 h-14 border-4 border-slate-700 border-t-cyan-400 rounded-full animate-spin"></div>
    <p class="mt-4 text-slate-300 font-semibold">กำลังตรวจสอบ <span id="loadingId" class="text-cyan-300"></span></p>
  </div>

  <!-- Result modal -->
  <div id="resultModal" class="hidden fixed inset-0 z-50 bg-slate-950/90 flex items-end sm:items-center justify-center p-3">
    <div id="resultCard" class="pop w-full max-w-md rounded-3xl overflow-hidden bg-white text-slate-900 shadow-2xl">
      <div id="resultHeader" class="px-5 py-4 text-white">
        <div class="flex items-center gap-3">
          <div id="resultIcon" class="text-4xl leading-none"></div>
          <div>
            <div id="resultTitle" class="text-2xl font-extrabold leading-tight"></div>
            <div id="resultSub" class="text-sm opacity-90"></div>
          </div>
        </div>
      </div>

      <div id="resultBody" class="p-5">
        <div id="personBlock">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="text-xs text-slate-500">ชื่อ-นามสกุล</div>
              <div id="rName" class="text-2xl font-extrabold leading-snug break-words"></div>
            </div>
            <div class="text-right shrink-0">
              <div class="text-xs text-slate-500">รหัส</div>
              <div id="rId" class="font-bold text-slate-700"></div>
            </div>
          </div>
          <span id="rRole" class="inline-block mt-2 px-3 py-1 rounded-full text-sm font-bold"></span>
          <div id="rBranch" class="hidden mt-2 text-sm text-slate-600 leading-snug"></div>

          <div class="grid grid-cols-2 gap-3 mt-4">
            <div class="rounded-2xl bg-slate-100 p-4 text-center">
              <div class="text-xs text-slate-500 font-semibold">เลขที่นั่ง</div>
              <div id="rSeat" class="text-4xl font-extrabold mt-1 break-all"></div>
            </div>
            <div class="rounded-2xl bg-slate-100 p-4 text-center">
              <div class="text-xs text-slate-500 font-semibold">ลำดับขึ้นเวที</div>
              <div id="rSeq" class="text-4xl font-extrabold mt-1 break-all"></div>
              <div id="rSeqNote" class="hidden text-[11px] text-amber-700 mt-1 leading-tight">จะประกาศหลังทราบผลรางวัล</div>
            </div>
          </div>
          <div class="mt-3 text-sm text-slate-500 text-center">เวลาเช็คอิน: <span id="rTime" class="font-semibold text-slate-700"></span></div>
        </div>

        <div id="errorBlock" class="hidden text-center py-2">
          <p id="errorMsg" class="text-lg font-semibold text-slate-700"></p>
          <p class="text-sm text-slate-500 mt-2">ตรวจสอบรหัสอีกครั้ง หรือส่งต่อจุดลงทะเบียนหลัก</p>
        </div>

        <button id="okBtn" class="mt-5 w-full py-4 rounded-2xl bg-slate-900 text-white text-xl font-extrabold active:bg-slate-700">
          OK · สแกนคนถัดไป
        </button>
      </div>
    </div>
  </div>

<script>

/* ===== ตั้งค่า API สำหรับเวอร์ชันโฮสต์ภายนอก =====
   URL /exec ถูกเก็บในเครื่อง (localStorage) หลังกรอกครั้งแรก
   หรือส่งลิงก์แบบ ?api=<URL /exec> ให้สตาฟฟ์ เพื่อตั้งค่าอัตโนมัติ */
const API_KEY = 'checkin_api_url';
function getApiUrl() {
  const fromParam = new URLSearchParams(location.search).get('api');
  if (fromParam) { try { localStorage.setItem(API_KEY, fromParam); } catch (e) {} return fromParam; }
  try { return localStorage.getItem(API_KEY) || ''; } catch (e) { return ''; }
}
let API_URL = getApiUrl();

function apiFetch(action, payload = {}) {
  if (!API_URL) return Promise.reject(new Error('ยังไม่ได้ตั้งค่า URL ของระบบ'));
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload }),
  }).then(r => r.json());
}

function showSetup(message) {
  let box = document.getElementById('setupBox');
  if (!box) {
    box = document.createElement('div');
    box.id = 'setupBox';
    box.className = 'fixed inset-0 z-[60] bg-slate-950/95 flex items-center justify-center p-4';
    box.innerHTML = `
      <div class="w-full max-w-md rounded-3xl bg-white text-slate-900 p-5">
        <h2 class="text-xl font-extrabold">⚙️ ตั้งค่าระบบ</h2>
        <p class="text-sm text-slate-600 mt-1">วาง Web app URL (ลงท้ายด้วย <b>/exec</b>) จาก Apps Script</p>
        <textarea id="setupUrl" rows="3" class="mt-3 w-full p-3 rounded-xl border border-slate-300 text-sm break-all" placeholder="https://script.google.com/macros/s/.../exec"></textarea>
        <p id="setupMsg" class="text-sm mt-2 text-red-600"></p>
        <button id="setupSave" class="mt-3 w-full py-3 rounded-2xl bg-slate-900 text-white font-extrabold">บันทึกและทดสอบ</button>
      </div>`;
    document.body.appendChild(box);
    document.getElementById('setupUrl').value = API_URL;
    document.getElementById('setupSave').onclick = async () => {
      const url = document.getElementById('setupUrl').value.trim();
      const msg = document.getElementById('setupMsg');
      if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { msg.textContent = 'URL ต้องขึ้นต้นด้วย https://script.google.com และลงท้ายด้วย /exec'; return; }
      msg.className = 'text-sm mt-2 text-slate-500'; msg.textContent = 'กำลังทดสอบการเชื่อมต่อ…';
      API_URL = url;
      try {
        const s = await apiFetch('stats');
        if (!s || !s.ok) throw new Error((s && s.message) || 'ไม่ได้รับข้อมูล');
        try { localStorage.setItem(API_KEY, url); } catch (e) {}
        location.reload();
      } catch (err) {
        msg.className = 'text-sm mt-2 text-red-600';
        msg.textContent = 'เชื่อมต่อไม่สำเร็จ: ' + (err.message || err) + ' — ตรวจว่า Deploy แบบ Who has access: Anyone';
      }
    };
  }
  if (message) document.getElementById('setupMsg').textContent = message;
}

const DUPLICATE_WINDOW_MS = 3000;   // กันสแกนรหัสเดิมซ้ำภายใน 3 วินาที
const HISTORY_LIMIT = 15;

const ROLE_STYLES = {
  'เยาวชนผู้เข้าแข่งขัน':        'bg-blue-100 text-blue-800',
  'ผู้เชี่ยวชาญสาขา':           'bg-purple-100 text-purple-800',
  'ผู้สนับสนุนรับเกียรติบัตร':    'bg-amber-100 text-amber-800',
  'ผู้สนับสนุนรับโล่':           'bg-rose-100 text-rose-800',
};

/* ============================ State ============================ */
const $ = id => document.getElementById(id);
let qr = null;
let cameraOn = false;
let busy = false;
let lastCode = '', lastCodeAt = 0;
let history = [];
let mode = 'checkIn';   // 'checkIn' | 'lookup'

const MODE_INFO = {
  checkIn: 'สแกนแล้วบันทึกเช็คอินทันที',
  lookup:  'ดูข้อมูลและลำดับขึ้นเวทีล่าสุด โดยไม่บันทึกเช็คอิน',
};

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => {
    const active = b.dataset.mode === m;
    b.className = 'mode-btn py-3 rounded-xl font-bold text-sm ' +
      (active ? (m === 'checkIn' ? 'bg-emerald-500 text-slate-950' : 'bg-sky-500 text-slate-950') : 'text-slate-400');
  });
  $('modeHint').textContent = MODE_INFO[m];
}

/* ============================ API ============================ */
function callApi(action, payload = {}) { return apiFetch(action, payload); }

/* ============================ Camera ============================ */
async function startCamera() {
  hideCameraError();
  try {
    if (!qr) {
      qr = new Html5Qrcode('reader', {
        formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
        verbose: false,
      });
    }
    await qr.start(
      { facingMode: 'environment' },
      {
        fps: 12,
        qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.72); return { width: s, height: s }; },
        aspectRatio: 1.0,
        disableFlip: true,
      },
      onScanSuccess,
      () => {} // ignore per-frame "not found"
    );
    cameraOn = true;
    $('cameraPlaceholder').classList.add('hidden');
    $('scanFrame').classList.remove('paused');
    $('cameraBtn').textContent = '⏹ ปิดกล้อง';
    $('cameraBtn').className = 'mt-3 w-full py-4 rounded-2xl bg-slate-800 active:bg-slate-700 text-slate-100 font-extrabold text-lg';
  } catch (err) {
    cameraOn = false;
    showCameraError(err);
  }
}

async function stopCamera() {
  try { if (qr && cameraOn) await qr.stop(); } catch (e) {}
  cameraOn = false;
  $('cameraPlaceholder').classList.remove('hidden');
  $('scanFrame').classList.add('paused');
  $('cameraBtn').textContent = '📷 เปิดกล้องสแกน';
  $('cameraBtn').className = 'mt-3 w-full py-4 rounded-2xl bg-cyan-500 active:bg-cyan-600 text-slate-950 font-extrabold text-lg shadow-lg shadow-cyan-500/20';
}

function pauseScanner() {
  try {
    if (qr && cameraOn && qr.getState() === Html5QrcodeScannerState.SCANNING) qr.pause(true);
  } catch (e) {}
  $('scanFrame').classList.add('paused');
}

function resumeScanner() {
  try {
    if (qr && cameraOn && qr.getState() === Html5QrcodeScannerState.PAUSED) qr.resume();
  } catch (e) {}
  if (cameraOn) $('scanFrame').classList.remove('paused');
}

function onScanSuccess(text) {
  const code = String(text || '').trim();
  if (!code || busy) return;
  const now = Date.now();
  if (code === lastCode && now - lastCodeAt < DUPLICATE_WINDOW_MS) return;
  lastCode = code; lastCodeAt = now;
  pauseScanner();
  processId(code);
}

function showCameraError(err) {
  const msg = String((err && (err.message || err.name)) || err);
  let hint = 'ไม่สามารถเปิดกล้องได้';
  if (/NotAllowed|Permission/i.test(msg)) hint = 'ไม่ได้รับอนุญาตให้ใช้กล้อง — กรุณาอนุญาตสิทธิ์กล้องในการตั้งค่าเบราว์เซอร์ แล้วลองใหม่';
  else if (/NotFound|no camera|Requested device not found/i.test(msg)) hint = 'ไม่พบกล้องบนอุปกรณ์นี้';
  else if (/NotReadable|in use/i.test(msg)) hint = 'กล้องถูกใช้งานโดยแอปอื่นอยู่ — ปิดแอปอื่นแล้วลองใหม่';
  $('cameraError').innerHTML = '';
  const p1 = document.createElement('p'); p1.className = 'font-semibold'; p1.textContent = hint;
  const p2 = document.createElement('p'); p2.className = 'mt-1 text-red-300/80';
  p2.textContent = 'แนะนำให้เปิดลิงก์ด้วย Chrome (Android) หรือ Safari (iPhone) ไม่ใช่เบราว์เซอร์ในแอป LINE/Facebook — ระหว่างนี้ใช้ช่องพิมพ์รหัสด้านล่างได้';
  const p3 = document.createElement('p'); p3.className = 'mt-1 text-xs text-red-400/70'; p3.textContent = msg;
  $('cameraError').append(p1, p2, p3);
  $('cameraError').classList.remove('hidden');
}
function hideCameraError() { $('cameraError').classList.add('hidden'); }

/* ============================ Check-in flow ============================ */
async function processId(id) {
  busy = true;
  $('loadingId').textContent = id;
  $('loading').classList.remove('hidden');
  try {
    const res = await callApi(mode, { id });
    showResult(res, id);
  } catch (err) {
    showResult({ ok: false, code: 'NETWORK', message: 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ: ' + (err.message || err) }, id);
  } finally {
    $('loading').classList.add('hidden');
  }
}

function showResult(res, id) {
  const header = $('resultHeader');
  const isPerson = res.ok && res.person;

  $('personBlock').classList.toggle('hidden', !isPerson);
  $('errorBlock').classList.toggle('hidden', !!isPerson);

  if (isPerson) {
    const p = res.person;
    $('rName').textContent = p.name || '-';
    $('rId').textContent = p.id || id;
    $('rRole').textContent = p.role || 'ไม่ระบุบทบาท';
    $('rRole').className = 'inline-block mt-2 px-3 py-1 rounded-full text-sm font-bold ' + (ROLE_STYLES[p.role] || 'bg-slate-200 text-slate-800');
    $('rBranch').textContent = p.branch ? '📍 ' + p.branch : '';
    $('rBranch').classList.toggle('hidden', !p.branch);
    $('rSeat').textContent = p.seat || '-';
    const seqPending = !p.sequence;
    $('rSeq').textContent = seqPending ? 'รอประกาศ' : p.sequence;
    $('rSeq').className = seqPending
      ? 'text-2xl font-extrabold mt-2 text-amber-600'
      : 'text-4xl font-extrabold mt-1 break-all';
    $('rSeqNote').classList.toggle('hidden', !seqPending);
    $('rTime').textContent = res.checkInTime || 'ยังไม่ได้เช็คอิน';
  }

  if (res.ok && res.status === 'CHECKED_IN') {
    header.className = 'px-5 py-4 text-white bg-emerald-600';
    $('resultIcon').textContent = '✅';
    $('resultTitle').textContent = 'เช็คอินสำเร็จ';
    $('resultSub').textContent = 'แจ้งเลขที่นั่งให้ผู้เข้าร่วมงานได้เลย';
    feedback('success');
  } else if (res.ok && res.status === 'ALREADY') {
    header.className = 'px-5 py-4 text-slate-900 bg-amber-400';
    $('resultIcon').textContent = '⚠️';
    $('resultTitle').textContent = 'เช็คอินไปแล้ว';
    $('resultSub').textContent = 'เคยเช็คอินเมื่อ ' + (res.checkInTime || '-');
    feedback('warn');
  } else if (res.ok && res.status === 'LOOKUP') {
    header.className = 'px-5 py-4 text-white bg-sky-600';
    $('resultIcon').textContent = '🔎';
    $('resultTitle').textContent = 'ข้อมูลล่าสุด';
    $('resultSub').textContent = res.checkedIn ? 'เช็คอินแล้ว · ' + res.checkInTime : 'ยังไม่ได้เช็คอิน (โหมดนี้ไม่บันทึก)';
    feedback('success');
  } else {
    header.className = 'px-5 py-4 text-white bg-red-600';
    $('resultIcon').textContent = '❌';
    $('resultTitle').textContent = res.code === 'NOT_FOUND' ? 'ไม่พบข้อมูล' : 'เกิดข้อผิดพลาด';
    $('resultSub').textContent = 'รหัส: ' + id;
    $('errorMsg').textContent = res.message || 'ไม่ทราบสาเหตุ';
    feedback('error');
  }

  addHistory(res, id);
  $('resultModal').classList.remove('hidden');
  $('resultCard').classList.remove('pop'); void $('resultCard').offsetWidth; $('resultCard').classList.add('pop');
  $('okBtn').focus();
}

function closeResult() {
  $('resultModal').classList.add('hidden');
  $('manualId').value = '';
  busy = false;
  resumeScanner();
  refreshStats();
}

/* ============================ Feedback ============================ */
let audioCtx = null;
function feedback(type) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const tones = { success: [880, 1320], warn: [660, 660], error: [220, 180] }[type];
    tones.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = f; o.type = 'sine';
      g.gain.value = 0.15;
      o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + i * 0.14;
      o.start(t); o.stop(t + 0.11);
    });
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(type === 'success' ? 80 : [120, 60, 120]);
}

/* ============================ History & Stats ============================ */
function addHistory(res, id) {
  const time = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const state = res.ok ? res.status : 'ERROR';
  history.unshift({ id, name: res.person ? res.person.name : (res.message || ''), seat: res.person ? res.person.seat : '', state, time });
  history = history.slice(0, HISTORY_LIMIT);
  renderHistory();
}

function renderHistory() {
  const ul = $('historyList');
  ul.innerHTML = '';
  if (!history.length) {
    const li = document.createElement('li');
    li.className = 'text-sm text-slate-500'; li.textContent = 'ยังไม่มีรายการ';
    ul.appendChild(li); return;
  }
  const dot = { CHECKED_IN: 'bg-emerald-400', ALREADY: 'bg-amber-400', LOOKUP: 'bg-sky-400', ERROR: 'bg-red-500' };
  history.forEach(h => {
    const li = document.createElement('li');
    li.className = 'flex items-center gap-3 p-3 rounded-xl bg-slate-900 border border-slate-800';
    const d = document.createElement('span'); d.className = 'w-2.5 h-2.5 rounded-full shrink-0 ' + (dot[h.state] || dot.ERROR);
    const mid = document.createElement('div'); mid.className = 'min-w-0 flex-1';
    const n = document.createElement('div'); n.className = 'text-sm font-semibold truncate'; n.textContent = h.name;
    const s = document.createElement('div'); s.className = 'text-xs text-slate-400';
    s.textContent = 'รหัส ' + h.id + (h.seat ? ' · ที่นั่ง ' + h.seat : '');
    mid.append(n, s);
    const t = document.createElement('span'); t.className = 'text-xs text-slate-500 shrink-0'; t.textContent = h.time;
    li.append(d, mid, t);
    ul.appendChild(li);
  });
}

async function refreshStats() {
  try {
    const s = await callApi('stats');
    if (s && s.ok) { $('statChecked').textContent = s.checkedIn; $('statTotal').textContent = s.total; }
  } catch (e) {}
}

/* ============================ Events ============================ */
$('cameraBtn').addEventListener('click', () => cameraOn ? stopCamera() : startCamera());

$('manualForm').addEventListener('submit', e => {
  e.preventDefault();
  const id = $('manualId').value.trim();
  if (!id || busy) return;
  $('manualId').blur();
  pauseScanner();
  processId(id);
});

$('okBtn').addEventListener('click', closeResult);
document.addEventListener('keydown', e => {
  if (!$('resultModal').classList.contains('hidden') && (e.key === 'Enter' || e.key === 'Escape')) {
    e.preventDefault(); closeResult();
  }
});
$('statsBtn').addEventListener('click', refreshStats);
document.querySelectorAll('.mode-btn').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
setMode('checkIn');
$('clearHistory').addEventListener('click', () => { history = []; renderHistory(); });

// หยุดกล้องเมื่อสลับแอป เพื่อประหยัดแบตฯ แล้วเปิดใหม่เมื่อกลับมา
let resumeOnVisible = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden && cameraOn) { resumeOnVisible = true; stopCamera(); }
  else if (!document.hidden && resumeOnVisible) { resumeOnVisible = false; startCamera(); }
});

if (!API_URL) showSetup();
refreshStats();
setInterval(refreshStats, 30000);
</script>
